{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="page-header">
    <h4><i class="bi bi-key"></i> Change Password</h4>
    <p>Update your account password</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-modern">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label style="color: #1e293b; font-weight: 500;" class="mb-2">Old Password</label>
                    <input type="password" name="old_password" class="form-control form-control-modern" placeholder="Enter old password" required>
                </div>
                <div class="mb-3">
                    <label style="color: #1e293b; font-weight: 500;" class="mb-2">New Password</label>
                    <input type="password" name="new_password1" class="form-control form-control-modern" placeholder="Enter new password" required>
                </div>
                <div class="mb-4">
                    <label style="color: #1e293b; font-weight: 500;" class="mb-2">Confirm New Password</label>
                    <input type="password" name="new_password2" class="form-control form-control-modern" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn btn-primary-modern me-2">
                    <i class="bi bi-check-circle me-1"></i>Change Password
                </button>
                <a href="{% url 'profile' %}" class="btn btn-outline-modern">
                    <i class="bi bi-arrow-left me-1"></i>Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
