{% extends 'base.html' %}
{% block title %}New Ticket{% endblock %}

{% block content %}
<div class="page-header">
    <h4><i class="bi bi-plus-circle"></i> New Support Ticket</h4>
    <p>Submit your query or issue</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card-modern">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label style="color: #1e293b;" class="mb-2">Subject</label>
                    <input type="text" name="subject" class="form-control form-control-modern" placeholder="Enter subject" required>
                </div>
                <div class="mb-4">
                    <label style="color: #1e293b;" class="mb-2">Message</label>
                    <textarea name="message" class="form-control form-control-modern" rows="6" placeholder="Describe your issue..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary-modern me-2">
                    <i class="bi bi-send me-1"></i>Submit Ticket
                </button>
                <a href="{% url 'support_list' %}" class="btn btn-outline-modern">
                    <i class="bi bi-arrow-left me-1"></i>Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
