{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Withdrawal{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-arrow-up-circle me-2"></i>Withdrawal Request</h4>
<div class="row">
    <div class="col-md-6">
        <div class="card wallet-card">
            <div class="card-body">
                <p class="text-muted">Enter withdrawal amount, select wallet, and provide your UPI ID or wallet address.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-warning">Request Withdrawal</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
