{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Deposit{% endblock %}

{% block content %}
<div class="page-header">
    <h4><i class="bi bi-arrow-down-circle"></i> Deposit Request</h4>
    <p>Submit your deposit amount and upload payment screenshot</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-modern">
            <div class="alert" style="background: #dbeafe; border-left: 4px solid #3b82f6; color: #1e40af; border-radius: 8px; padding: 12px;">
                <i class="bi bi-info-circle me-2"></i>
                Admin will approve your deposit within 24 hours.
            </div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary-modern w-100 py-3">
                    <i class="bi bi-send me-2"></i>Submit Deposit
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
